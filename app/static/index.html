<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>speech 语音对话</title>
<style>
:root{color-scheme:light;font-family:system-ui,sans-serif;color:#172936;background:#f2f5f7}body{max-width:780px;margin:50px auto;padding:0 22px}h1{font-size:30px}h2{font-size:20px}section{background:white;border:1px solid #d9e2e8;border-radius:12px;padding:24px;margin:20px 0}label{display:block;margin:12px 0 6px}input[type=password],textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #a8bac7;border-radius:6px;font:inherit}textarea{min-height:100px}button{font:inherit;padding:10px 16px;margin:10px 8px 0 0;border:0;border-radius:6px;background:#174d69;color:white;cursor:pointer}button:disabled{opacity:.45;cursor:wait}small{display:block;color:#526977;margin:10px 0}output{display:block;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:15px;line-height:1.6}audio{width:100%;margin-top:16px}.error{color:#a22323}footer{color:#526977;margin:20px 0}
</style>
<h1>speech 语音对话</h1><p>输入问题或录一段话，让语音助手回答。</p>
<section><label for="token">设备令牌</label><input id="token" type="password" autocomplete="off" placeholder="粘贴 APP_TOKEN"><small>令牌仅保留在当前页面内存，刷新后清空。</small><button id="check">检查服务</button><output id="status" role="status" aria-live="polite"></output></section>
<section><h2>与助手对话</h2><label for="question">你的问题</label><textarea id="question" maxlength="4000" placeholder="例如：为什么秋天的叶子会变黄？"></textarea><label><input id="autoSpeak" type="checkbox" checked> 自动播报回答</label><button id="ask">发送问题</button><button id="askAudio">用下方录音或文件提问</button><button id="newChat">新对话</button><button id="replay" disabled>播报上一条回答</button><button id="stopReply" disabled>停止播报</button><output id="chatStatus" role="status" aria-live="polite"></output><output id="conversation" aria-label="对话记录"></output><audio id="replyPlayer" controls></audio><small>保留当前页面最近 10 轮对话；刷新或新对话会清空。回答由服务端配置的模型生成。</small></section>
<section><h2>语音识别</h2><label for="file">上传音频，或使用下方录音</label><input id="file" type="file" accept="audio/*,video/mp4"><small>最长 30 秒，最大 10MiB。浏览器录音需要 HTTPS 或 localhost。</small><button id="record">开始录音</button><button id="stop" disabled>停止录音</button><button id="recognize">识别所选音频</button><output id="asr" role="status" aria-live="polite"></output></section>
<section><h2>语音播报</h2><label for="text">播报文字</label><textarea id="text" maxlength="400">你好，语音服务已经准备好了。今天是十一月一日。</textarea><label for="speed">语速 <span id="speedValue">1.0</span></label><input id="speed" type="range" min="0.5" max="2" step="0.1" value="1"><br><button id="speak">生成并播放</button><output id="tts" role="status" aria-live="polite"></output><audio id="player" controls></audio><a id="download" hidden download="speech.wav">下载 WAV</a></section>
<footer>在服务端配置大模型后可对话。识别、回答和播报状态分别展示。</footer>
<script>
const el=id=>document.getElementById(id);let recorder,stream,timer,recorded,mediaUrl;
function show(id,text,error=false){el(id).textContent=text;el(id).className=error?'error':''}
async function api(path,options={}){const token=el('token').value.trim();if(!token)throw Error('请先填写设备令牌');const response=await fetch(path,{...options,headers:{...options.headers,Authorization:'Bearer '+token}});if(!response.ok){let data;try{data=await response.json()}catch{}throw Error(data?.error?.message||'请求失败 '+response.status)}return response}
async function action(button,target,fn){button.disabled=true;show(target,'正在处理…');try{await fn()}catch(error){show(target,error.message,true)}finally{button.disabled=false}}
el('check').onclick=()=>action(el('check'),'status',async()=>{const r=await api('/v1/capabilities');const data=await r.json();show('status','识别：'+(data.models.asr||'未就绪')+'\n播报：'+(data.models.tts||'未就绪')+'\n大模型：'+(data.llm_configured?data.llm.model+'（已配置，发送问题可验证连接）':'尚未配置大模型'))})
el('speed').oninput=()=>el('speedValue').textContent=Number(el('speed').value).toFixed(1);
el('file').onchange=()=>{recorded=null;show('asr','已选择文件，点击识别。')};
el('recognize').onclick=()=>action(el('recognize'),'asr',async()=>{const file=recorded||el('file').files[0];if(!file)throw Error('请先录音或选择文件');if(file.size>10*1024*1024)throw Error('文件超过 10MiB');const form=new FormData();form.append('file',file,'recording');const r=await api('/v1/transcriptions',{method:'POST',body:form});const d=await r.json();show('asr',(d.text||'未识别到文字')+'\n录音 '+d.audio_seconds+' 秒，处理 '+d.elapsed_seconds+' 秒')});
el('speak').onclick=()=>action(el('speak'),'tts',async()=>{const r=await api('/v1/speech',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:el('text').value,speed:Number(el('speed').value)})});const blob=await r.blob();if(mediaUrl)URL.revokeObjectURL(mediaUrl);mediaUrl=URL.createObjectURL(blob);el('player').src=mediaUrl;el('download').href=mediaUrl;el('download').hidden=false;show('tts','音频 '+r.headers.get('X-Audio-Seconds')+' 秒，合成 '+r.headers.get('X-Elapsed-Seconds')+' 秒');try{await el('player').play()}catch{show('tts','音频已生成，请点击播放器播放。')}});
el('record').onclick=async()=>{try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('此浏览器无法录音，请使用 HTTPS/localhost 或上传音频');stream=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{clearTimeout(timer);stream.getTracks().forEach(t=>t.stop());recorded=new Blob(chunks,{type:recorder.mimeType});el('file').value='';el('record').disabled=false;el('stop').disabled=true;show('asr','录音已保存到页面内存，点击识别。')};recorder.start();el('record').disabled=true;el('stop').disabled=false;show('asr','录音中，最多 30 秒…');timer=setTimeout(()=>{if(recorder.state==='recording')recorder.stop()},29500)}catch(e){stream?.getTracks().forEach(t=>t.stop());show('asr',e.message,true)}};
el('stop').onclick=()=>{if(recorder?.state==='recording')recorder.stop()};
window.addEventListener('pagehide',()=>{clearTimeout(timer);stream?.getTracks().forEach(t=>t.stop());if(mediaUrl)URL.revokeObjectURL(mediaUrl)});
</script><script src="/chat.js"></script></html>
